# Cofre — site privado de arquivos.
#
# Este é um projeto separado do BRUTO OS que vive na raiz do repositório.
# No Netlify, crie um site NOVO e aponte o "base directory" para `cofre`.
#
# Variáveis de ambiente obrigatórias (Site settings → Environment variables):
#   SENHA_ACESSO    — a senha de entrada (mínimo 10 caracteres)
#   SEGREDO_SESSAO  — string aleatória longa que assina o cookie de sessão

[build]
  publish = "public"
  functions = "netlify/functions"
  # Nenhum passo de build: a interface é HTML/CSS/JS servidos como estão.
  command = "echo 'sem build'"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

# `netlify dev` para desenvolver na sua máquina. Sem isto o CLI tenta adivinhar um
# framework a partir do node_modules e pergunta qual usar.
[dev]
  framework = "#static"
  publish = "public"
  targetPort = 8888

# As rotas ficam declaradas no `export const config` de cada função
# (`path: '/api/...'`), então não há redirects de API aqui.

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    # `data:` em img-src é para o ícone SVG embutido no index.html.
    Content-Security-Policy = "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; form-action 'none'; frame-ancestors 'none'; base-uri 'none'"
    # O cofre não deve aparecer em buscador nenhum.
    X-Robots-Tag = "noindex, nofollow, noarchive"
